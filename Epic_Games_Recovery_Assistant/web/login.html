<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090609"><title>Sign in — Recovery Assistant Dashboard</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at top right,#4b1530,#090609 60%);color:#18212f}.card{width:min(100%,430px);padding:28px;border:1px solid #d6dce5;border-radius:18px;background:rgba(255,255,255,.97);box-shadow:0 22px 70px #0008}h1{margin:0 0 8px;font-size:1.55rem}p{color:#526174;line-height:1.5}label{display:block;font-weight:650;margin:16px 0 6px}input{width:100%;padding:13px;border:1px solid #aeb9c8;border-radius:9px;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:9px;background:#16803c;color:#fff;font-size:1rem;font-weight:750}button:disabled{opacity:.6}#message{min-height:24px;color:#991b1b;font-size:.92rem}.note{font-size:.84rem;color:#64748b}</style></head><body><main class="card"><h1>Dashboard sign in</h1><p>Enter the dashboard username and password to continue.</p><form id="loginForm"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="128"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><button id="submit" type="submit">Sign in</button><p id="message" role="alert" aria-live="polite"></p></form><p class="note">Your sign-in is checked by the server. Credentials are not stored in this page or in the public source repository.</p></main><script>
const form=document.getElementById("loginForm"),button=document.getElementById("submit"),message=document.getElementById("message");
form.addEventListener("submit",async event=>{event.preventDefault();button.disabled=true;message.textContent="Checking sign-in…";try{const response=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({username:form.elements.username.value,password:form.elements.password.value})});const data=await response.json();if(!response.ok)throw new Error(data.error||"Sign-in failed.");message.textContent="";location.replace("/");}catch(error){message.textContent=error.message||"Unable to sign in.";button.disabled=false;}});
</script></body></html>
