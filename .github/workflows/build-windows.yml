name: Build Windows Recovery Assistant
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Epic_Games_Recovery_Assistant/**"
      - ".github/workflows/build-windows.yml"
  push:
    branches: [main]
    paths:
      - "Epic_Games_Recovery_Assistant/**"
      - ".github/workflows/build-windows.yml"
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate PowerShell updater scripts
        shell: pwsh
        run: |
          $files = @('Epic_Games_Recovery_Assistant/update_project.ps1', 'Epic_Games_Recovery_Assistant/install_auto_update.ps1', 'Epic_Games_Recovery_Assistant/web/network_security_snapshot.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; throw "PowerShell syntax validation failed: $file" }
          }
          Write-Host 'PowerShell updater scripts parsed successfully.'
      - name: Validate embedded web JavaScript syntax
        shell: pwsh
        run: |
          @'
          const fs = require('fs');
          const html = fs.readFileSync('Epic_Games_Recovery_Assistant/web/index.html', 'utf8');
          const network = fs.readFileSync('Epic_Games_Recovery_Assistant/web/network_security.js', 'utf8');
          new Function(network);
          const scripts = [...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('No inline JavaScript blocks found');
          for (const [i, match] of scripts.entries()) {
            if (match[1].trim()) new Function(match[1]);
          }
          console.log(`Validated ${scripts.length} inline script block(s) and network_security.js.`);
          '@ | node
      - name: Build Windows executable
        shell: pwsh
        working-directory: Epic_Games_Recovery_Assistant
        run: |
          g++ --version
          g++ -std=c++17 -O2 -Wall -Wextra recovery_assistant.c++ -o Epic_Games_Recovery_Assistant.exe -static -static-libgcc -static-libstdc++ -lshell32 -lwinhttp -lbcrypt
          if ($LASTEXITCODE -ne 0) { throw "C++ build failed" }
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Epic-Games-Recovery-Assistant-Windows
          path: Epic_Games_Recovery_Assistant/Epic_Games_Recovery_Assistant.exe
          if-no-files-found: error
          retention-days: 30
      - name: Package complete project and checksum
        shell: pwsh
        run: |
          $project = "Epic_Games_Recovery_Assistant"
          $zip = "Epic-Games-Recovery-Assistant-project.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$project/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Encoding ascii SHA256SUMS.txt
      - name: Upload complete project update package
        uses: actions/upload-artifact@v4
        with:
          name: Epic-Games-Recovery-Assistant-Project
          path: |
            Epic-Games-Recovery-Assistant-project.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Send generic Discord build notification
        if: always()
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BUILD_RESULT: ${{ job.status }}
        run: |
          if (-not $env:DISCORD_WEBHOOK_URL) {
            Write-Host "Discord webhook secret is not configured; notification skipped."
            exit 0
          }
          $payload = @{ content = "Epic Games Recovery Assistant Windows build: $($env:BUILD_RESULT)." } | ConvertTo-Json -Compress
          try {
            Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method Post -ContentType "application/json" -Body $payload | Out-Null
            Write-Host "Generic Discord build notification sent."
          } catch {
            Write-Warning "Discord build notification failed; build result is unchanged."
          }

  web-container-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build browser app container
        run: docker build -t recovery-assistant-web:test Epic_Games_Recovery_Assistant/web
      - name: Start container and verify served assets
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name recovery-assistant-web-test -p 18080:8080 recovery-assistant-web:test
          cleanup() { docker logs recovery-assistant-web-test || true; docker rm -f recovery-assistant-web-test >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl --fail --silent http://127.0.0.1:18080/healthz)" = "ok"
          curl --fail --silent http://127.0.0.1:18080/ | grep -q 'network_security.js'
          curl --fail --silent http://127.0.0.1:18080/network_security.js | grep -q 'analyzeNetworkCapture'
          curl --fail --silent -D headers.txt -o index.html http://127.0.0.1:18080/
          grep -qi 'Content-Security-Policy:.*https://cdnjs.cloudflare.com' headers.txt
          grep -qi 'worker-src.*blob:' headers.txt
          echo "Container health, HTML, network analyzer asset, and CSP checks passed."
