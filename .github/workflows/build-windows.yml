name: Build Windows Recovery Assistant
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Epic_Games_Recovery_Assistant/**"
      - ".github/workflows/build-windows.yml"
  push:
    branches: [main]
    paths:
      - "Epic_Games_Recovery_Assistant/**"
      - ".github/workflows/build-windows.yml"
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $files = @('Epic_Games_Recovery_Assistant/update_project.ps1', 'Epic_Games_Recovery_Assistant/install_auto_update.ps1', 'Epic_Games_Recovery_Assistant/web/network_security_snapshot.ps1', 'Epic_Games_Recovery_Assistant/web/network_tools.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; throw "PowerShell syntax validation failed: $file" }
          }
          Write-Host 'All PowerShell scripts parsed successfully.'
      - name: Validate new network helper safety guards
        shell: pwsh
        run: |
          $script = Get-Content 'Epic_Games_Recovery_Assistant/web/network_tools.ps1' -Raw
          foreach ($required in @('Test-PrivateIPv4', 'RFC1918', 'Ports.Count -gt 32', 'InstallDailyStatusTask', 'RemoveDailyStatusTask')) {
            if ($script -notmatch [regex]::Escape($required)) { throw "Missing network-helper guard or command: $required" }
          }
      - name: Validate embedded web JavaScript syntax
        shell: pwsh
        run: |
          @'
          const fs = require('fs');
          const html = fs.readFileSync('Epic_Games_Recovery_Assistant/web/index.html', 'utf8');
          const network = fs.readFileSync('Epic_Games_Recovery_Assistant/web/network_security.js', 'utf8');
          const tools = fs.readFileSync('Epic_Games_Recovery_Assistant/web/network-tools.html', 'utf8');
          new Function(network);
          const inline = [...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)];
          for (const [i, match] of inline.entries()) if (match[1].trim()) new Function(match[1]);
          const toolScripts = [...tools.matchAll(/<script>([\s\S]*?)<\/script>/gi)];
          if (!toolScripts.length) throw new Error('Network tools page has no script');
          for (const match of toolScripts) new Function(match[1]);
          console.log('Validated main app, network analyzer, and network tools JavaScript.');
          '@ | node
      - name: Validate Windows batch launchers
        shell: pwsh
        run: |
          $required = @('build.bat', 'setup.bat', 'run.bat')
          foreach ($name in $required) {
            $path = Join-Path $PWD "Epic_Games_Recovery_Assistant/$name"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing launcher: $name" }
            $content = Get-Content -LiteralPath $path -Raw
            if ($content -notmatch '(?i)@echo off') { throw "Invalid batch launcher: $name" }
          }
          Write-Host 'All three Windows batch launchers are present.'
      - name: Build Windows executable through one-click builder
        shell: cmd
        working-directory: Epic_Games_Recovery_Assistant
        run: |
          set BUILD_NO_PAUSE=1
          call build.bat
          if errorlevel 1 exit /b 1
          if not exist Epic_Games_Recovery_Assistant.exe exit /b 1
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Epic-Games-Recovery-Assistant-Windows
          path: Epic_Games_Recovery_Assistant/Epic_Games_Recovery_Assistant.exe
          if-no-files-found: error
          retention-days: 30
      - name: Package complete project and checksum
        shell: pwsh
        run: |
          $project = "Epic_Games_Recovery_Assistant"
          $zip = "Epic-Games-Recovery-Assistant-project.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$project/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Encoding ascii SHA256SUMS.txt
      - name: Upload complete project update package
        uses: actions/upload-artifact@v4
        with:
          name: Epic-Games-Recovery-Assistant-Project
          path: |
            Epic-Games-Recovery-Assistant-project.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Send generic Discord build notification
        if: always()
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BUILD_RESULT: ${{ job.status }}
        run: |
          if (-not $env:DISCORD_WEBHOOK_URL) {
            Write-Host "Discord webhook secret is not configured; notification skipped."
            exit 0
          }
          $payload = @{ content = "Epic Games Recovery Assistant Windows build: $($env:BUILD_RESULT)." } | ConvertTo-Json -Compress
          try {
            Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method Post -ContentType "application/json" -Body $payload | Out-Null
            Write-Host "Generic Discord build notification sent."
          } catch {
            Write-Warning "Discord build notification failed; build result is unchanged."
          }

  web-container-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build browser app container
        run: docker build -t recovery-assistant-web:test Epic_Games_Recovery_Assistant/web
      - name: Start container and verify served assets
        shell: bash
        run: |
          set -euxo pipefail
          docker run -d --name recovery-assistant-web-test -p 18080:8080 recovery-assistant-web:test
          cleanup() { docker logs recovery-assistant-web-test || true; docker rm -f recovery-assistant-web-test >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/healthz | grep -Fxq ok
          curl --fail --silent http://127.0.0.1:18080/ -o root.html
          grep -Fq 'network_security.js' root.html
          grep -Fq 'IP &amp; Network Tools' root.html
          curl --fail --silent http://127.0.0.1:18080/network-tools.html -o network-tools.html
          grep -Fq 'Local IP & Network Tools' network-tools.html
          curl --fail --silent http://127.0.0.1:18080/network_tools.ps1 -o network_tools.ps1
          grep -Fq 'Test-PrivateIPv4' network_tools.ps1
          curl --fail --silent http://127.0.0.1:18080/SETUP_AND_USAGE.txt -o SETUP_AND_USAGE.txt
          grep -Fq 'SETUP AND USAGE' SETUP_AND_USAGE.txt
          curl --fail --silent -D headers.txt -o /dev/null http://127.0.0.1:18080/
          grep -qi 'Content-Security-Policy:.*https://cdnjs.cloudflare.com' headers.txt
          grep -qi 'worker-src.*blob:' headers.txt
          echo "Container health, existing assets, network tools page/helper, setup guide, and CSP checks passed."
