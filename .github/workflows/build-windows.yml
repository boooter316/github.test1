name: Build Windows Recovery Assistant
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "DISCORD-SERVER-DASHBOARD/**"
      - "Epic_Games_Recovery_Assistant/**"
      - "recovery-panel/**"
      - ".github/workflows/build-windows.yml"
  push:
    branches: [main]
    paths:
      - "DISCORD-SERVER-DASHBOARD/**"
      - "Epic_Games_Recovery_Assistant/**"
      - "recovery-panel/**"
      - ".github/workflows/build-windows.yml"
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Build Discord C++ bot with pinned vcpkg dependencies
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot -or -not (Test-Path (Join-Path $vcpkgRoot 'vcpkg.exe'))) {
            $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
            git clone https://github.com/microsoft/vcpkg $vcpkgRoot
            if ($LASTEXITCODE -ne 0) { throw 'Unable to obtain vcpkg.' }
            & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics
            if ($LASTEXITCODE -ne 0) { throw 'Unable to bootstrap vcpkg.' }
          }
          # Hosted runners may provide a shallow vcpkg checkout. Fetch the exact
          # manifest baseline commit so vcpkg can read its version database.
          $baseline = '0df93a05b9de080129e653ec4776d7e14a1b2e4f'
          git -C $vcpkgRoot fetch --depth=1 origin $baseline
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch the pinned vcpkg baseline.' }
          git -C $vcpkgRoot cat-file -e "${baseline}:versions/baseline.json"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned vcpkg baseline version database is unavailable.' }
          & (Join-Path $vcpkgRoot 'vcpkg.exe') version
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg version check failed.' }
          $toolchain = Join-Path $vcpkgRoot 'scripts/buildsystems/vcpkg.cmake'
          cmake -S 'DISCORD-SERVER-DASHBOARD/cpp-bot' -B 'build/discord-cpp-bot' -DCMAKE_TOOLCHAIN_FILE="$toolchain" -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE -ne 0) { throw 'Discord C++ bot CMake configure failed.' }
          cmake --build 'build/discord-cpp-bot' --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Discord C++ bot build failed.' }
      - name: Install native C++ and Poppler dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-poppler
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $files = @('Epic_Games_Recovery_Assistant/update_project.ps1', 'Epic_Games_Recovery_Assistant/install_auto_update.ps1', 'Epic_Games_Recovery_Assistant/setup_dependencies.ps1', 'Epic_Games_Recovery_Assistant/first_run_setup.ps1', 'Epic_Games_Recovery_Assistant/web/network_security_snapshot.ps1', 'Epic_Games_Recovery_Assistant/web/network_tools.ps1', 'Epic_Games_Recovery_Assistant/web/project_vulnerability_audit.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; throw "PowerShell syntax validation failed: $file" }
          }
          Write-Host 'All PowerShell scripts parsed successfully.'
      - name: Validate updater package manifest and synchronized launcher version
        shell: pwsh
        run: |
          $updater = Get-Content 'Epic_Games_Recovery_Assistant/update_project.ps1' -Raw
          foreach ($required in @('paf_evidence_scanner.c++','PDF_EVIDENCE_SCANNER.bat','network_security.js','ghostface-bg.jpg')) {
            if (-not $updater.Contains($required)) { throw "Updater does not validate required project asset: $required" }
          }
          $run = Get-Content 'Epic_Games_Recovery_Assistant/run.bat' -Raw
          if ($run -notmatch 'title Epic Games Recovery Assistant 5[.]2[.]0') { throw 'run.bat version title is not synchronized to 5.2.0.' }
          foreach ($file in @('Epic_Games_Recovery_Assistant/setup_dependencies.ps1','Epic_Games_Recovery_Assistant/first_run_setup.ps1')) {
            $text = Get-Content $file -Raw
            if ($text -notmatch 'pacman -Syu --noconfirm') { throw "MSYS2 full-update command missing from $file" }
          }
          Write-Host 'Updater manifest, launcher version, and MSYS2 update checks passed.'
      - name: Validate new network helper safety guards
        shell: pwsh
        run: |
          $script = Get-Content 'Epic_Games_Recovery_Assistant/web/network_tools.ps1' -Raw
          foreach ($required in @('Test-PrivateIPv4', 'RFC1918', 'Ports.Count -gt 32', 'InstallDailyStatusTask', 'RemoveDailyStatusTask')) {
            if ($script -notmatch [regex]::Escape($required)) { throw "Missing network-helper guard or command: $required" }
          }
      - name: Validate Windows batch launchers
        shell: pwsh
        run: |
          $required = @('OPEN_DASHBOARD.cmd', 'OPEN_PROJECT.bat', 'FIRST_RUN_SETUP.bat', 'START_HERE.bat', 'build.bat', 'setup.bat', 'run.bat', 'PDF_EVIDENCE_SCANNER.bat')
          foreach ($name in $required) {
            $path = Join-Path $PWD "Epic_Games_Recovery_Assistant/$name"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing launcher: $name" }
            $content = Get-Content -LiteralPath $path -Raw
            if ($content -notmatch '(?i)@echo off') { throw "Invalid batch launcher: $name" }
          }
          Write-Host 'All Windows batch launchers are present.'
      - name: Verify desktop-only launcher and native dashboard
        shell: pwsh
        run: |
          $setup = Get-Content 'Epic_Games_Recovery_Assistant/first_run_setup.ps1' -Raw
          foreach ($forbidden in @('server.mjs', '127.0.0.1:8080', 'Start-Process ''http', 'Node.js LTS', 'Docker Desktop')) {
            if ($setup.Contains($forbidden)) { throw "Desktop launcher still contains browser/server startup: $forbidden" }
          }
          $source = Get-Content 'Epic_Games_Recovery_Assistant/recovery_assistant.c++' -Raw
          foreach ($required in @('NATIVE COMMAND DASHBOARD', 'Recovery progress tracker', 'Official Epic account and support links', 'Start / continue an Epic recovery case', 'runLocalSecretHygieneScanner', 'Potential hard-coded secret-like assignment', 'VALUE REDACTED', 'Recovery tracker - Epic Account ID')) {
            if (-not $source.Contains($required)) { throw "Missing native dashboard feature: $required" }
          }
          Write-Host 'Native command dashboard and recovery tracker checks passed.'
      - name: Validate native C++ PDF evidence scanner
        shell: pwsh
        run: |
          $scanner = 'Epic_Games_Recovery_Assistant/paf_evidence_scanner.c++'
          $source = Get-Content $scanner -Raw
          foreach ($required in @('extractPdfText', 'NO READABLE TEXT', 'OCR is not performed', 'document text not retained', 'Ownership verification: NOT PERFORMED', 'MAX_PDF_BYTES', 'MAX_PAGES', 'MAX_FILES')) {
            if (-not $source.Contains($required)) { throw "Missing native scanner behavior: $required" }
          }
          if ($source -match 'std::cout\s*<<\s*(extracted|page|text)') { throw 'Scanner appears to print extracted PDF text.' }
          if (-not (Get-Command pdftotext.exe -ErrorAction SilentlyContinue)) { throw 'Poppler pdftotext.exe is not available on PATH.' }
          g++ -std=c++17 -O2 -Wall -Wextra $scanner -o paf_evidence_scanner_test.exe -static -static-libgcc -static-libstdc++
          if ($LASTEXITCODE -ne 0) { throw 'Native PDF scanner compilation failed.' }
          .\paf_evidence_scanner_test.exe --help | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Native PDF scanner help smoke test failed.' }
          $native = Get-Content 'Epic_Games_Recovery_Assistant/recovery_assistant.c++' -Raw
          if ($native -match 'notifyDiscord|WinHttpSendRequest|EPIC_RECOVERY_DISCORD_WEBHOOK') { throw 'Native desktop source still contains an outbound Discord webhook path.' }
          Write-Host 'Native C++ PDF scanner compilation and local-only source checks passed.'
      - name: Build Windows executables through one-click builder
        shell: cmd
        working-directory: Epic_Games_Recovery_Assistant
        run: |
          set BUILD_NO_PAUSE=1
          call build.bat
          if errorlevel 1 exit /b 1
          if not exist Epic_Games_Recovery_Assistant.exe exit /b 1
          if not exist paf_evidence_scanner.exe exit /b 1
      - name: Upload Windows executable
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Epic-Games-Recovery-Assistant-Windows
          path: |
            Epic_Games_Recovery_Assistant/Epic_Games_Recovery_Assistant.exe
            Epic_Games_Recovery_Assistant/paf_evidence_scanner.exe
          if-no-files-found: error
          retention-days: 30
      - name: Package Windows desktop bundle
        shell: pwsh
        run: |
          $bundle = "Windows-Desktop-Bundle"
          New-Item -ItemType Directory -Force $bundle | Out-Null
          Copy-Item 'Epic_Games_Recovery_Assistant/Epic_Games_Recovery_Assistant.exe' $bundle
          Copy-Item 'Epic_Games_Recovery_Assistant/OPEN_DASHBOARD.cmd' $bundle
          Copy-Item 'Epic_Games_Recovery_Assistant/paf_evidence_scanner.exe' $bundle
          Copy-Item 'Epic_Games_Recovery_Assistant/paf_evidence_scanner.c++' $bundle
          Copy-Item 'Epic_Games_Recovery_Assistant/PDF_EVIDENCE_SCANNER.bat' $bundle
          Copy-Item 'Epic_Games_Recovery_Assistant/setup_dependencies.ps1' $bundle
          Copy-Item 'Epic_Games_Recovery_Assistant/README.md' $bundle
          $hash = (Get-FileHash -Algorithm SHA256 "$bundle/Epic_Games_Recovery_Assistant.exe").Hash.ToLowerInvariant()
          "$hash  Epic_Games_Recovery_Assistant.exe" | Set-Content -Encoding ascii "$bundle/SHA256SUMS.txt"
          $scannerHash = (Get-FileHash -Algorithm SHA256 "$bundle/paf_evidence_scanner.exe").Hash.ToLowerInvariant()
          "$scannerHash  paf_evidence_scanner.exe" | Add-Content -Encoding ascii "$bundle/SHA256SUMS.txt"
          Compress-Archive -Path "$bundle/*" -DestinationPath "Epic-Games-Recovery-Assistant-Windows-Bundle.zip" -CompressionLevel Optimal
      - name: Package complete project and checksum
        shell: pwsh
        run: |
          $project = "Windows-Project-Package"
          $zip = "Epic-Games-Recovery-Assistant-project.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          if (Test-Path $project) { Remove-Item $project -Recurse -Force }
          New-Item -ItemType Directory -Force $project | Out-Null
          Copy-Item 'Epic_Games_Recovery_Assistant' $project -Recurse
          Copy-Item 'DISCORD-SERVER-DASHBOARD' $project -Recurse
          Copy-Item 'recovery-panel' $project -Recurse
          Copy-Item 'docs' $project -Recurse
          Copy-Item 'README.md' $project
          Compress-Archive -Path "$project/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Encoding ascii SHA256SUMS.txt
      - name: Upload Windows desktop bundle
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Epic-Games-Recovery-Assistant-Windows-Bundle
          path: Epic-Games-Recovery-Assistant-Windows-Bundle.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload complete project update package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Epic-Games-Recovery-Assistant-Project
          path: |
            Epic-Games-Recovery-Assistant-project.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
