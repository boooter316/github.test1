name: Build Windows Recovery Assistant
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Epic_Games_Recovery_Assistant/**"
      - ".github/workflows/build-windows.yml"
  push:
    branches: [main]
    paths:
      - "Epic_Games_Recovery_Assistant/**"
      - ".github/workflows/build-windows.yml"
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $files = @('Epic_Games_Recovery_Assistant/update_project.ps1', 'Epic_Games_Recovery_Assistant/install_auto_update.ps1', 'Epic_Games_Recovery_Assistant/setup_dependencies.ps1', 'Epic_Games_Recovery_Assistant/first_run_setup.ps1', 'Epic_Games_Recovery_Assistant/web/network_security_snapshot.ps1', 'Epic_Games_Recovery_Assistant/web/network_tools.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; throw "PowerShell syntax validation failed: $file" }
          }
          Write-Host 'All PowerShell scripts parsed successfully.'
      - name: Validate new network helper safety guards
        shell: pwsh
        run: |
          $script = Get-Content 'Epic_Games_Recovery_Assistant/web/network_tools.ps1' -Raw
          foreach ($required in @('Test-PrivateIPv4', 'RFC1918', 'Ports.Count -gt 32', 'InstallDailyStatusTask', 'RemoveDailyStatusTask')) {
            if ($script -notmatch [regex]::Escape($required)) { throw "Missing network-helper guard or command: $required" }
          }
      - name: Validate Windows batch launchers
        shell: pwsh
        run: |
          $required = @('OPEN_PROJECT.bat', 'FIRST_RUN_SETUP.bat', 'START_HERE.bat', 'build.bat', 'setup.bat', 'run.bat')
          foreach ($name in $required) {
            $path = Join-Path $PWD "Epic_Games_Recovery_Assistant/$name"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing launcher: $name" }
            $content = Get-Content -LiteralPath $path -Raw
            if ($content -notmatch '(?i)@echo off') { throw "Invalid batch launcher: $name" }
          }
          Write-Host 'All three Windows batch launchers are present.'
      - name: Verify desktop-only launcher and native dashboard
        shell: pwsh
        run: |
          $setup = Get-Content 'Epic_Games_Recovery_Assistant/first_run_setup.ps1' -Raw
          foreach ($forbidden in @('server.mjs', '127.0.0.1:8080', 'Start-Process ''http', 'Node.js LTS', 'Docker Desktop')) {
            if ($setup.Contains($forbidden)) { throw "Desktop launcher still contains browser/server startup: $forbidden" }
          }
          $source = Get-Content 'Epic_Games_Recovery_Assistant/recovery_assistant.c++' -Raw
          foreach ($required in @('NATIVE COMMAND DASHBOARD', 'Recovery progress tracker', 'Official Epic account and support links', 'Start / continue an Epic recovery case', 'runLocalSecretHygieneScanner', 'Potential hard-coded secret-like assignment', 'VALUE REDACTED', 'Recovery tracker - Epic Account ID')) {
            if (-not $source.Contains($required)) { throw "Missing native dashboard feature: $required" }
          }
          Write-Host 'Native command dashboard, local secret-hygiene scanner, recovery tracker, and desktop-only launcher checks passed.'
      - name: Validate local PDF evidence scanner
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check 'pypdf>=5.0,<7'
          python -m py_compile Epic_Games_Recovery_Assistant/pdf_evidence_scanner.py
          python Epic_Games_Recovery_Assistant/pdf_evidence_scanner.py --help | Out-Host
          $source = Get-Content 'Epic_Games_Recovery_Assistant/pdf_evidence_scanner.py' -Raw
          foreach ($required in @('NO READABLE TEXT', 'OCR is not performed', 'document text not retained', 'Ownership verification: NOT PERFORMED')) {
            if (-not $source.Contains($required)) { throw "Missing PDF scanner safety/report behavior: $required" }
          }
          $native = Get-Content 'Epic_Games_Recovery_Assistant/recovery_assistant.c++' -Raw
          if ($native -match 'notifyDiscord|WinHttpSendRequest|EPIC_RECOVERY_DISCORD_WEBHOOK') { throw 'Native desktop source still contains an outbound Discord webhook path.' }
          Write-Host 'PDF scanner syntax and local-only safety checks passed.'
      - name: Build Windows executable through one-click builder
        shell: cmd
        working-directory: Epic_Games_Recovery_Assistant
        run: |
          set BUILD_NO_PAUSE=1
          call build.bat
          if errorlevel 1 exit /b 1
          if not exist Epic_Games_Recovery_Assistant.exe exit /b 1
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Epic-Games-Recovery-Assistant-Windows
          path: Epic_Games_Recovery_Assistant/Epic_Games_Recovery_Assistant.exe
          if-no-files-found: error
          retention-days: 30
      - name: Package Windows desktop bundle
        shell: pwsh
        run: |
          $bundle = "Windows-Desktop-Bundle"
          New-Item -ItemType Directory -Force $bundle | Out-Null
          Copy-Item 'Epic_Games_Recovery_Assistant/Epic_Games_Recovery_Assistant.exe' $bundle
          Copy-Item 'Epic_Games_Recovery_Assistant/pdf_evidence_scanner.py' $bundle
          Copy-Item 'Epic_Games_Recovery_Assistant/requirements-pdf.txt' $bundle
          Copy-Item 'Epic_Games_Recovery_Assistant/PDF_EVIDENCE_SCANNER.bat' $bundle
          Copy-Item 'Epic_Games_Recovery_Assistant/README.md' $bundle
          $hash = (Get-FileHash -Algorithm SHA256 "$bundle/Epic_Games_Recovery_Assistant.exe").Hash.ToLowerInvariant()
          "$hash  Epic_Games_Recovery_Assistant.exe" | Set-Content -Encoding ascii "$bundle/SHA256SUMS.txt"
          Compress-Archive -Path "$bundle/*" -DestinationPath "Epic-Games-Recovery-Assistant-Windows-Bundle.zip" -CompressionLevel Optimal
      - name: Package complete project and checksum
        shell: pwsh
        run: |
          $project = "Epic_Games_Recovery_Assistant"
          $zip = "Epic-Games-Recovery-Assistant-project.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$project/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Encoding ascii SHA256SUMS.txt
      - name: Upload Windows desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: Epic-Games-Recovery-Assistant-Windows-Bundle
          path: Epic-Games-Recovery-Assistant-Windows-Bundle.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload complete project update package
        uses: actions/upload-artifact@v4
        with:
          name: Epic-Games-Recovery-Assistant-Project
          path: |
            Epic-Games-Recovery-Assistant-project.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
