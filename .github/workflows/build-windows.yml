name: Build Windows Recovery Assistant

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Epic_Games_Recovery_Assistant/recovery_assistant.c++"
      - "Epic_Games_Recovery_Assistant/README.md"
      - "Epic_Games_Recovery_Assistant/setup.bat"
      - "Epic_Games_Recovery_Assistant/build.bat"
      - "Epic_Games_Recovery_Assistant/run.bat"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build Windows executable
        shell: pwsh
        working-directory: Epic_Games_Recovery_Assistant
        run: |
          g++ --version
          g++ -std=c++17 -O2 -Wall -Wextra recovery_assistant.c++ -o Epic_Games_Recovery_Assistant.exe -static -static-libgcc -static-libstdc++ -lshell32
          if ($LASTEXITCODE -ne 0) { throw "C++ build failed" }
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Epic-Games-Recovery-Assistant-Windows
          path: Epic_Games_Recovery_Assistant/Epic_Games_Recovery_Assistant.exe
          if-no-files-found: error
          retention-days: 30
