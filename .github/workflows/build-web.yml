name: Build Recovery Assistant Web Server
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "Epic_Games_Recovery_Assistant/web/**"
      - "recovery-panel/**"
      - ".github/workflows/build-web.yml"
  push:
    branches: [main]
    paths:
      - "Epic_Games_Recovery_Assistant/web/**"
      - "recovery-panel/**"
      - ".github/workflows/build-web.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 26 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Check inline browser JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.parts = []
                  self.current = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.in_script = True
                      self.current = []

              def handle_data(self, data):
                  if self.in_script:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      self.parts.append("".join(self.current))
                      self.in_script = False

          sources = [
              Path("Epic_Games_Recovery_Assistant/web/index.html"),
              Path("recovery-panel/public/index.html"),
          ]
          for source_path in sources:
              parser = ScriptExtractor()
              parser.feed(source_path.read_text(encoding="utf-8"))
              scripts = [script for script in parser.parts if script.strip()]
              if not scripts:
                  raise SystemExit(f"No inline JavaScript found in {source_path}")
              output = Path("/tmp") / (source_path.parent.name + "-inline.js")
              output.write_text("\n".join(scripts), encoding="utf-8")
              print(f"{source_path}: extracted {len(scripts)} inline script block(s) -> {output}")
          PY
          node --check /tmp/web-inline.js
          node --check /tmp/public-inline.js
      - name: Validate Node.js server entry points and Recovery Panel dependencies
        working-directory: recovery-panel
        run: |
          node --check server.js
          npm install --no-audit --no-fund
          npm run check
          npm audit --omit=dev --audit-level=high
      - name: Verify pinned PDF.js module and worker configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages = [Path("Epic_Games_Recovery_Assistant/web/index.html"), Path("recovery-panel/public/index.html")]
          for page in pages:
              source = page.read_text(encoding="utf-8")
              assert "pdfjs-dist@6.5.438/build/pdf.min.mjs" in source, f"PDF.js module missing or version drifted in {page}"
              assert "pdfjs-dist@6.5.438/build/pdf.worker.min.mjs" in source, f"PDF.js worker missing or version drifted in {page}"
              assert "3.11.174" not in source, f"Legacy PDF.js reference remains in {page}"
          for path in [Path("Epic_Games_Recovery_Assistant/web/server.mjs"), Path("recovery-panel/server.js")]:
              source = path.read_text(encoding="utf-8")
              assert "https://cdn.jsdelivr.net" in source, f"CSP does not allow jsDelivr in {path}"
          print("Both browser interfaces use the pinned PDF.js module and matching worker.")
          PY
      - name: Validate standalone web server and external network analyzer
        run: |
          node --check Epic_Games_Recovery_Assistant/web/server.mjs
          node --check Epic_Games_Recovery_Assistant/web/network_security.js
      - name: Compile C++17 web server
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic Epic_Games_Recovery_Assistant/web/server.cpp -o recovery-web
      - name: Upload Linux server binary
        uses: actions/upload-artifact@v4
        with:
          name: Recovery-Assistant-Web-Linux
          path: recovery-web
