name: Build Recovery Assistant Web Server
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "DISCORD-SERVER-DASHBOARD/**"
      - "Epic_Games_Recovery_Assistant/web/**"
      - "recovery-panel/**"
      - ".github/workflows/build-web.yml"
  push:
    branches: [main]
    paths:
      - "DISCORD-SERVER-DASHBOARD/**"
      - "Epic_Games_Recovery_Assistant/web/**"
      - "recovery-panel/**"
      - ".github/workflows/build-web.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Node.js 26 LTS
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      - name: Check inline browser JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.parts = []
                  self.current = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.in_script = True
                      self.current = []

              def handle_data(self, data):
                  if self.in_script:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      self.parts.append("".join(self.current))
                      self.in_script = False

          sources = [
              Path("Epic_Games_Recovery_Assistant/web/index.html"),
              Path("Epic_Games_Recovery_Assistant/web/network-tools.html"),
              Path("recovery-panel/public/index.html"),
          ]
          for source_path in sources:
              parser = ScriptExtractor()
              parser.feed(source_path.read_text(encoding="utf-8"))
              scripts = [script for script in parser.parts if script.strip()]
              if not scripts:
                  raise SystemExit(f"No inline JavaScript found in {source_path}")
              output = Path("/tmp") / (source_path.parent.name + "-" + source_path.stem + "-inline.js")
              output.write_text("\n".join(scripts), encoding="utf-8")
              print(f"{source_path}: extracted {len(scripts)} inline script block(s) -> {output}")
          PY
          node --check /tmp/web-index-inline.js
          node --check /tmp/web-network-tools-inline.js
          node --check /tmp/public-index-inline.js
          node --check DISCORD-SERVER-DASHBOARD/dashboard.js
          node - <<'NODE'
          const fs = require("node:fs");
          const source = fs.readFileSync("DISCORD-SERVER-DASHBOARD/dashboard.js", "utf8");
          const html = fs.readFileSync("DISCORD-SERVER-DASHBOARD/index.html", "utf8");
          const referencedIds = [...source.matchAll(/\$\("([^"]+)"\)/g)].map((match) => match[1]);
          const declaredIds = new Set([...html.matchAll(/\bid="([^"]+)"/g)].map((match) => match[1]));
          const missing = [...new Set(referencedIds)].filter((id) => !declaredIds.has(id));
          if (missing.length) throw new Error("Companion dashboard is missing required elements: " + missing.join(", "));
          console.log("Companion dashboard JavaScript syntax and DOM ID checks passed.");
          NODE
          node --check Epic_Games_Recovery_Assistant/web/workspace-controls.js
          node --check recovery-panel/public/workspace-controls.js
          node -e "const fs=require('node:fs');const h=fs.readFileSync('Epic_Games_Recovery_Assistant/web/index.html','utf8');for(const id of ['sbPythonTab','sbCppTab','sbCustomTab','sbOpenEditor','sbStop','sbSave','sbTest','sbRun','sbBuild'])if(!h.includes(id))throw new Error('Missing Script Builder control: '+id);const n=fs.readFileSync('Epic_Games_Recovery_Assistant/web/network-tools.html','utf8');for(const id of ['hostScanTab','vulnerabilityScanTab','makeAuditCommand','copyAuditCommand'])if(!n.includes(id))throw new Error('Missing network security control: '+id)"
      - name: Test private LAN dashboard host
        run: |
          python3 -m py_compile DISCORD-SERVER-DASHBOARD/private_lan_server.py
          python3 -m unittest discover -s DISCORD-SERVER-DASHBOARD/tests -v
          node -e "const fs=require('node:fs');const h=fs.readFileSync('Epic_Games_Recovery_Assistant/web/index.html','utf8');const s=fs.readFileSync('Epic_Games_Recovery_Assistant/web/server.mjs','utf8');for(const id of ['discordDashboardTabButton','discordDashboardTab'])if(!h.includes(id))throw new Error('Missing companion dashboard tab: '+id);for(const route of ['/discord-server-dashboard/index.html','/discord-server-dashboard/dashboard.css','/discord-server-dashboard/dashboard.js'])if(!s.includes(route))throw new Error('Missing dashboard asset route: '+route);if(!s.includes(\"frame-ancestors 'self'\"))throw new Error('Dashboard iframe CSP must allow same-origin embedding')"
      - name: Validate Node.js server entry points and Recovery Panel dependencies
        working-directory: recovery-panel
        run: |
          node --check server.js
          node --check public/identifier-scanner.js
          node -e "const fs=require('node:fs');const h=fs.readFileSync('public/index.html','utf8');for(const id of ['identifierTabButton','identifierTabPanel','runIdentifierScan','downloadIdentifierReport'])if(!h.includes(id))throw new Error('Missing identifier scanner UI control: '+id)"
          npm install --no-audit --no-fund
          npm run check
          npm audit --omit=dev --audit-level=high
      - name: Run standalone web server regression tests
        working-directory: Epic_Games_Recovery_Assistant/web
        run: |
          node --check server.mjs
          node --test tests/server.test.mjs
          node --check network_security.js
      - name: Compile C++17 web server
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic Epic_Games_Recovery_Assistant/web/server.cpp -o recovery-web
      - name: Upload Linux server binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Recovery-Assistant-Web-Linux
          path: recovery-web
